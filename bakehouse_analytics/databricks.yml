# This is a Declarative Automation Bundle definition for bakehouse_analytics.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: bakehouse_analytics
  uuid: 568c7eb7-304b-461c-8f15-c72d13d5bb37

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    presets:
      name_prefix: dev_
    default: true
    workspace:
      host: https://dbc-11a56e66-a1e5.cloud.databricks.com
    variables:
      catalog: bakehouse_analytics_dev
      schema: rnd
  prod:
    mode: production
    presets:
      name_prefix: prod_
    workspace:
      host: https://dbc-11a56e66-a1e5.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/omkarlearning16@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/omkarlearning16@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: bakehouse_analytics_prd
      schema: rnd
    permissions:
      - user_name: omkarlearning16@gmail.com
        level: CAN_MANAGE
